    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-brand">
          <h1 class="brand-title">Nexus CRM</h1>
          <p class="brand-subtitle">Sign in to your account</p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="email">Email or Username</label>
            <input id="email" type="text" class="form-input" formControlName="email" placeholder="Enter your email" autocomplete="email" />
            <div class="form-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">Valid email is required</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input id="password" type="password" class="form-input" formControlName="password" placeholder="Enter your password" autocomplete="current-password" />
            <div class="form-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">Password is required</div>
          </div>
          <div class="form-error form-error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
          <button type="submit" class="btn btn-primary btn-full" [disabled]="loginForm.invalid || isLoading">
            {{ isLoading ? 'Signing in...' : 'Sign In' }}
          </button>
        </form>
        <div class="auth-links">
          <a routerLink="/auth/forgot-password" class="auth-link">Forgot password?</a>
          <span class="auth-text">Don't have an account? <a routerLink="/auth/register" class="auth-link">Sign up</a></span>
        </div>
      </div>
    </div>
