    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-brand">
          <h1 class="brand-title">Nexus CRM</h1>
          <p class="brand-subtitle">Create your account</p>
        </div>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="firstName">First Name</label>
              <input id="firstName" type="text" class="form-input" formControlName="firstName" placeholder="John" />
              <div class="form-error" *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">Required</div>
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Last Name</label>
              <input id="lastName" type="text" class="form-input" formControlName="lastName" placeholder="Doe" />
              <div class="form-error" *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">Required</div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input id="username" type="text" class="form-input" formControlName="username" placeholder="johndoe" />
            <div class="form-error" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">Required</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" class="form-input" formControlName="email" placeholder="john@example.com" autocomplete="email" />
            <div class="form-error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">Valid email is required</div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input id="password" type="password" class="form-input" formControlName="password" placeholder="Min 6 characters" autocomplete="new-password" />
              <div class="form-error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">At least 6 characters</div>
            </div>
            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm Password</label>
              <input id="confirmPassword" type="password" class="form-input" formControlName="confirmPassword" placeholder="Repeat password" autocomplete="new-password" />
              <div class="form-error" *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">Passwords do not match</div>
            </div>
          </div>
          <div class="form-error form-error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
          <button type="submit" class="btn btn-primary btn-full" [disabled]="registerForm.invalid || isLoading">
            {{ isLoading ? 'Creating account...' : 'Create Account' }}
          </button>
        </form>
        <div class="auth-links">
          <span class="auth-text">Already have an account? <a routerLink="/auth/login" class="auth-link">Sign in</a></span>
        </div>
      </div>
    </div>
