    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-brand">
          <h1 class="brand-title">Nexus CRM</h1>
          <p class="brand-subtitle">Reset your password</p>
        </div>
        <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!successMessage">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input id="email" type="email" class="form-input" formControlName="email" placeholder="Enter your email" autocomplete="email" />
            <div class="form-error" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">Valid email is required</div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" [disabled]="forgotForm.invalid || isLoading">
            {{ isLoading ? 'Sending...' : 'Send Reset Instructions' }}
          </button>
        </form>
        <div class="auth-links">
          <a routerLink="/auth/login" class="auth-link">Back to sign in</a>
        </div>
      </div>
    </div>
