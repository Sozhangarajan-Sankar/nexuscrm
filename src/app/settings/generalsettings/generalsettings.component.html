<div class="settings-page">
  <app-page-header title="General Settings"></app-page-header>

  <form [formGroup]="settingsForm" class="settings-form">
    <div class="form-section">
      <h2 class="section-title">Company Information</h2>
      <div class="form-group">
        <label class="form-label">Company Name</label>
        <input type="text" formControlName="companyName" class="form-input" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Timezone</label>
          <select formControlName="timezone" class="form-input">
            <option value="UTC">UTC (Coordinated Universal Time)</option>
            <option value="US/Eastern">US/Eastern (EST/EDT)</option>
            <option value="US/Central">US/Central (CST/CDT)</option>
            <option value="US/Mountain">US/Mountain (MST/MDT)</option>
            <option value="US/Pacific">US/Pacific (PST/PDT)</option>
            <option value="Europe/London">Europe/London (GMT/BST)</option>
            <option value="Europe/Berlin">Europe/Berlin (CET/CEST)</option>
            <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
            <option value="Asia/Shanghai">Asia/Shanghai (CST)</option>
            <option value="Australia/Sydney">Australia/Sydney (AEST/AEDT)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date Format</label>
          <select formControlName="dateFormat" class="form-input">
            <option value="MM/DD/YYYY">MM/DD/YYYY</option>
            <option value="DD/MM/YYYY">DD/MM/YYYY</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Currency</label>
        <select formControlName="currency" class="form-input">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="JPY">JPY (¥)</option>
          <option value="CAD">CAD ($)</option>
          <option value="AUD">AUD ($)</option>
        </select>
      </div>
    </div>

    <div class="form-section">
      <h2 class="section-title">Appearance</h2>
      <div class="theme-toggle-row">
        <div class="theme-info">
          <span class="theme-label">Dark Mode</span>
          <span class="theme-desc">{{ theme.current === 'dark' ? 'Dark theme is active' : 'Light theme is active' }}</span>
        </div>
        <button type="button" class="toggle-btn" [class.active]="theme.current === 'dark'" (click)="theme.toggle()">
          <span class="toggle-knob"></span>
        </button>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-primary" (click)="saveSettings()">Save Settings</button>
    </div>
  </form>

  <div class="notification" [ngClass]="{'show': showNotification}" [class.success]="notifType === 'success'" [class.error]="notifType === 'error'">
    {{ notifMessage }}
  </div>
</div>
