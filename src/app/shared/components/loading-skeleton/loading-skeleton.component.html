    <div class="skeleton" [style.width]="width">
      <div *ngIf="type === 'text'" class="skeleton-text">
        <div class="skeleton-line" *ngFor="let _ of range(rows)" style="height: 12px;"></div>
      </div>
      <div *ngIf="type === 'card'" class="skeleton-card" [style.height]="rows * 40 + 'px'">
        <div class="skeleton-line" style="width: 60%; height: 16px; margin-bottom: 12px;"></div>
        <div class="skeleton-line" style="width: 80%; height: 32px; margin-bottom: 8px;"></div>
        <div class="skeleton-line" style="width: 40%; height: 14px;"></div>
      </div>
      <div *ngIf="type === 'table'" class="skeleton-table">
        <div class="skeleton-table__header">
          <div class="skeleton-line" *ngFor="let _ of range(5)" style="height: 14px; width: 100%;"></div>
        </div>
        <div class="skeleton-table__row" *ngFor="let _ of range(rows)">
          <div class="skeleton-line" *ngFor="let _ of range(5)" style="height: 12px; width: 100%;"></div>
        </div>
      </div>
    </div>
