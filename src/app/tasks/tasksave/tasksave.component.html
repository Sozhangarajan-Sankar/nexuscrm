    <div class="page-container">
      <app-page-header [title]="isEditMode ? 'Edit Task' : 'Create Task'">
        <a routerLink="/tasks" class="btn btn-outline">Back to List</a>
      </app-page-header>

      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="form-card">
        <div class="form-group">
          <label>Title <span class="required">*</span></label>
          <input type="text" formControlName="title" placeholder="Task title">
          <div class="error" *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched">Title is required</div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea formControlName="description" rows="4" placeholder="Task description..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select formControlName="status">
              <option value="todo">To Do</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select formControlName="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" formControlName="dueDate">
          </div>
          <div class="form-group">
            <label>Assigned To</label>
            <select formControlName="assignedTo">
              <option value="">Select user...</option>
              <option *ngFor="let u of users" [value]="u.id">{{ u.firstName + ' ' + u.lastName }}</option>
            </select>
          </div>
        </div>

        <div class="form-section">
          <h3>Related To (Optional)</h3>
          <div class="form-row">
            <div class="form-group">
              <label>Type</label>
              <select formControlName="relatedToType">
                <option value="">None</option>
                <option value="deal">Deal</option>
                <option value="invoice">Invoice</option>
              </select>
            </div>
            <div class="form-group">
              <label>ID</label>
              <input type="text" formControlName="relatedToId" placeholder="Related item ID">
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">{{ isEditMode ? 'Update Task' : 'Create Task' }}</button>
          <a routerLink="/tasks" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
