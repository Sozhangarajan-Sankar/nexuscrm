    <div class="page-container">
      <app-page-header title="Task Board (Kanban)">
        <a routerLink="/tasks" class="btn btn-outline">List View</a>
        <a routerLink="/tasks/save" class="btn btn-primary">+ Add Task</a>
      </app-page-header>

      <div class="kanban-board">
        <div class="kanban-column" *ngFor="let col of columns">
          <div class="column-header">
            <h3 class="column-title">{{ col.name }}</h3>
            <span class="column-count">{{ getTasksForStatus(col.status).length }}</span>
          </div>
          <div class="column-body">
            <div class="task-card" *ngFor="let task of getTasksForStatus(col.status)" [ngClass]="'priority-' + task.priority" [routerLink]="['/tasks/save', task.id]">
              <h4 class="card-title">{{ task.title }}</h4>
              <span class="badge" [ngClass]="getPriorityClass(task.priority)">{{ task.priority }}</span>
              <div class="card-meta">
                <span class="card-user">{{ getUserName(task.assignedTo) }}</span>
                <span class="card-date">{{ task.dueDate | date:'shortDate' }}</span>
              </div>
            </div>
            <div class="empty-column" *ngIf="getTasksForStatus(col.status).length === 0">
              No tasks
            </div>
          </div>
        </div>
      </div>
    </div>
