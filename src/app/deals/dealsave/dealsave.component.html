    <div class="page-container">
      <app-page-header [title]="isEditMode ? 'Edit Deal' : 'Create Deal'">
        <a routerLink="/deals" class="btn btn-outline">Back to List</a>
      </app-page-header>

      <form [formGroup]="dealForm" (ngSubmit)="onSubmit()" class="form-card">
        <div class="form-row">
          <div class="form-group">
            <label>Title <span class="required">*</span></label>
            <input type="text" formControlName="title" placeholder="Deal title">
            <div class="error" *ngIf="dealForm.get('title')?.invalid && dealForm.get('title')?.touched">Title is required</div>
          </div>
          <div class="form-group">
            <label>Value <span class="required">*</span></label>
            <input type="number" formControlName="value" placeholder="0.00" step="0.01">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Currency</label>
            <select formControlName="currency">
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="GBP">GBP (£)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Stage</label>
            <select formControlName="stage">
              <option value="Qualification">Qualification</option>
              <option value="Proposal">Proposal</option>
              <option value="Negotiation">Negotiation</option>
              <option value="Closed Won">Closed Won</option>
              <option value="Closed Lost">Closed Lost</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Probability (%)</label>
            <div class="range-group">
              <input type="range" formControlName="probability" min="0" max="100" step="5">
              <span class="range-value">{{ dealForm.get('probability')?.value }}%</span>
            </div>
          </div>
          <div class="form-group">
            <label>Expected Close Date</label>
            <input type="date" formControlName="expectedCloseDate">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Customer</label>
            <select formControlName="customerId">
              <option value="">Select customer...</option>
              <option *ngFor="let c of customers" [value]="c.id">{{ c.firstName + ' ' + c.lastName }}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Assigned To</label>
            <select formControlName="assignedTo">
              <option value="">Select user...</option>
              <option *ngFor="let u of users" [value]="u.id">{{ u.firstName + ' ' + u.lastName }}</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea formControlName="notes" rows="4" placeholder="Additional notes..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="dealForm.invalid">{{ isEditMode ? 'Update Deal' : 'Create Deal' }}</button>
          <a routerLink="/deals" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
